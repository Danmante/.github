<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Danmante project banner</title>
  <desc id="desc">Danmante digital health infrastructure banner with a connected cross logo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b525b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e6c5"/>
      <stop offset="1" stop-color="#f4c95d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <path d="M0 282C190 210 300 340 494 264s320-62 706 25v71H0z" fill="#071d2b" opacity=".42"/>

  <g transform="translate(18 16)">
    <image href="../../danmante-logo.png" x="760" y="18" width="350" height="320" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g fill="#f5fbf8" font-family="Georgia, 'Times New Roman', serif">
    <text x="120" y="154" font-size="76" font-weight="700" letter-spacing="1">Danmante</text>
    <text x="124" y="208" font-size="25" fill="#b8e8dc" font-family="Arial, sans-serif" letter-spacing="4">CONNECTED CARE, BUILT WITH TRUST</text>
  </g>
  <path d="M126 242h270" stroke="#f4c95d" stroke-width="5" stroke-linecap="round"/>
  <g fill="#b8e8dc" font-family="Arial, sans-serif" font-size="17">
    <text x="124" y="282">Open-source digital health infrastructure</text>
  </g>
</svg>
